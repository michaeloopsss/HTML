<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tugas-24</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <style>
   * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: #f3f3f3;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.poster {
    position: relative;
    width: 600px;       
    height: 600px;      
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}
 

.bg {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(82%);
}


.content {
    position: absolute;
    top: 22%;
    width: 100%;
    text-align: center;
    color: white;
}


.loading-circle {
    width: 65px;
    height: 65px;
    border: 6px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    margin: 0 auto 15px auto;
    animation: spin 1.3s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.title {
    font-size: 80px;
    font-weight: 800;
    letter-spacing: -8px;
    animation:kanan 1s ease-out forwards;
}

.desc {
    margin-top: 20px;
    font-size: 14px;
    line-height: 1.4;
    opacity: 0.9;
    margin-bottom: 50px;
    animation:kiri 1.5s ease-out forwards;
}

@keyframes kanan {
    0% {
        transform: translateX(100px);
        opacity: 0;
    }
    100% {
        transform: translateX(0);
        opacity: 1;
    }
}
@keyframes kiri {
    0% {
        transform: translateX(-100px);
        opacity: 0;
    }
    100% {
        transform: translateX(0);
        opacity: 1;
    }
}
  </style>
  <body>
    <div class="poster">
      <img src="Imgimgimgigm.jpg" alt="Poster Background" class="bg" />

      <div class="content">
        <div class="loading-circle"></div>
        <h1 class="title">Loading.</h1>
        <p class="desc">
          Hidup masih loading, tapi setiap<br />
          persen yang maju adalah progres<br />
          yang berarti
        </p>
        
      </div>
    </div>
  </body>
</html>
